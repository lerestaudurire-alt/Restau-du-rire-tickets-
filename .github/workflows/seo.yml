name: Pages événements + sitemap
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "affiche.jpg"]
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: write
concurrency: seo-build
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save --no-package-lock sharp
      - run: node scripts/build-seo.mjs
      - name: Enregistrer les changements
        run: |
          git config user.name "seo-bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git add evenement sitemap.xml robots.txt
          git diff --cached --quiet || (git commit -m "SEO : pages événements + sitemap" && git push)
