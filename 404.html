<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Le Restau du Rire Tickets</title><meta name="theme-color" content="#0e2f2b">
<script>
/* Lien d'événement créé il y a moins de 10 min (page d'aperçu pas encore générée) : on ouvre quand même l'événement */
var m=location.pathname.match(/^(.*\/)e\/([^\/]+)\/?$/);
location.replace(m?m[1]+location.search+"#event/"+m[2]:location.pathname.replace(/[^\/]*$/,""));
</script></head><body style="font-family:system-ui,sans-serif;text-align:center;padding:40px;background:#0e2f2b;color:#fff">
<p>Ouverture…</p><p><a style="color:#ffc83d" href="./">Retour à l’accueil</a></p></body></html>
